name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-14,     generator: Xcode }
          - { name: Windows, os: windows-2022, generator: "Visual Studio 17 2022" }
          - { name: Linux,   os: ubuntu-24.04, generator: Ninja }
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxi-dev \
            libgl1-mesa-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Render test
        shell: bash
        run: |
          bin=$(find build/x0x_render_artefacts -type f -name "x0x_render*" -perm -u+x | head -1)
          "$bin" render-out

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/X0X_artefacts/Release/VST3 dist/ 2>/dev/null || true
          cp -R build/X0X_artefacts/Release/AU dist/ 2>/dev/null || true
          cp -R build/X0X_artefacts/Release/Standalone dist/ 2>/dev/null || true
          cp render-out/*.wav dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: X0X-${{ matrix.name }}
          path: dist
